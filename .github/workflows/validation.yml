name: Validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm run check
        working-directory: backend
      - run: npm run evaluate:fixtures
        working-directory: backend
      - run: npm audit --audit-level=moderate
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - run: npm run test:integration
        working-directory: backend
        env:
          PG_TEST_BIN: /usr/lib/postgresql/16/bin
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: node scripts/verify-api-isolation.cjs
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_MARKETING_ONLY: "true"
          VITE_EARLY_ACCESS_ENABLED: "false"
          VITE_API_BASE_URL: ""
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Install pinned browser test tools outside product dependencies
        run: npm install --prefix "$RUNNER_TEMP/kanyi-browser" --no-save --ignore-scripts playwright@1.64.1 @axe-core/playwright@4.14.0
      - name: Install Chromium
        run: node "$RUNNER_TEMP/kanyi-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Built marketing, intake and product browser regressions
        working-directory: frontend
        shell: bash
        run: |
          VITE_MARKETING_ONLY=true VITE_EARLY_ACCESS_ENABLED=true VITE_API_BASE_URL=http://127.0.0.1:9 npm run build -- --outDir "$RUNNER_TEMP/kanyi-marketing-dist"
          VITE_MARKETING_ONLY=false VITE_EARLY_ACCESS_ENABLED=false VITE_API_BASE_URL= npm run build -- --outDir "$RUNNER_TEMP/kanyi-product-closed-dist"
          VITE_MARKETING_ONLY=false VITE_EARLY_ACCESS_ENABLED=true VITE_API_BASE_URL= npm run build -- --outDir "$RUNNER_TEMP/kanyi-product-intake-dist"
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/kanyi-browser/node_modules/playwright"
          export AXE_MODULE="$RUNNER_TEMP/kanyi-browser/node_modules/@axe-core/playwright"
          export BROWSER_REPORT_DIR="$RUNNER_TEMP/kanyi-browser-report"
          export MARKETING_DIST="$RUNNER_TEMP/kanyi-marketing-dist"
          export PRODUCT_DIST="$RUNNER_TEMP/kanyi-product-closed-dist"
          export INTAKE_DIST="$RUNNER_TEMP/kanyi-product-intake-dist"
          export RUN_PRODUCT_REGRESSIONS=true
          node scripts/verify-public-modes.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: ${{ runner.temp }}/kanyi-browser-report
          if-no-files-found: warn
