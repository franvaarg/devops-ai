services:
  database:
    image: postgres:16
    container_name: devops-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository .env file}
      POSTGRES_DB: devops_ai

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/000_init.sql:ro
      - ./database/migrations/005_production_indexes.sql:/docker-entrypoint-initdb.d/005_production_indexes.sql:ro
      - ./database/migrations/004_commercial_product.sql:/docker-entrypoint-initdb.d/004_commercial_product.sql:ro
      - ./database/migrations/003_analysis_reservations.sql:/docker-entrypoint-initdb.d/003_analysis_reservations.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d devops_ai",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: devops-backend
    stop_grace_period: 70s
    restart: unless-stopped

    depends_on:
      database:
        condition: service_healthy

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ""
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository .env file}
      DB_NAME: devops_ai

    dns:
      - 8.8.8.8
      - 1.1.1.1

    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_LEGAL_NAME: ${VITE_LEGAL_NAME:-}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-}
        VITE_PRIVACY_URL: ${VITE_PRIVACY_URL:-}
        VITE_TERMS_URL: ${VITE_TERMS_URL:-}
    container_name: devops-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5173:5173"

volumes:
  postgres_data:
